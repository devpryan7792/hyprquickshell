# =============================================================================
# hyprlock.conf — Minimalist Obsidian Lockscreen
# =============================================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = /home/pryan/Pictures/wallpaper/7j1gqy.jpg
    blur_passes = 0
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.82
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time (Hours:Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(243, 244, 246, 0.95)
    font_size = 80
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(209, 213, 219, 0.8)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(107, 114, 128, 0.4)
    inner_color = rgba(11, 12, 16, 0.85)
    font_color = rgb(243, 244, 246)
    fade_on_empty = false
    placeholder_text = <span foreground="##9ca3af">Enter Password...</span>
    hide_input = false
    check_color = rgb(255, 179, 182)
    fail_color = rgb(255, 84, 73)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -50
    halign = center
    valign = center
}
