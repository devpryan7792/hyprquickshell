# Starship Prompt Configuration
# Minimal, fast, and harmonized with Material You dark aesthetics

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$package\
$golang\
$rust\
$nodejs\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

right_format = """"""

# Timeout for commands in milliseconds
command_timeout = 500

# Disable the blank line at the start of the prompt
add_newline = false

[character]
success_symbol = "[❯](bold #a6c8ff)"
error_symbol = "[❯](bold #ffb4ab)"
vicmd_symbol = "[❮](bold #e5c07b)"

[directory]
style = "bold #bdc7dc"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold #ffb4ab"

[git_branch]
symbol = " "
style = "bold #dbbde2"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #ffb4ab"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = " "
modified = " "
staged = " "
renamed = "» "
deleted = "✘ "

[cmd_duration]
min_time = 2_000
style = "bold #e5c07b"
format = "took [$duration]($style) "

[package]
disabled = true

[python]
symbol = " "
style = "bold #e5c07b"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold #98c379"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold #e06c75"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #4db6ac"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold #61afef"
format = "[$symbol$context]($style) "
